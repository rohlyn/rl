<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorraine's - 历史最高收入</title>
    <!-- 复用原有 Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 24'><path fill='%23000000' d='M16.67 12.68c-.07-1.77 1.45-2.63 1.52-2.66-.83-1.2-2.1-1.37-2.56-1.39-1.08-.11-2.12.64-2.67.64-.55 0-1.4-.62-2.3-.6-1.18.01-2.27.68-2.88 1.74-1.23 2.12-.32 5.26.88 6.98.58.84 1.28 1.78 2.2 1.75.88-.04 1.21-.57 2.28-.57 1.06 0 1.36.57 2.28.55.94-.02 1.54-.86 2.12-1.7.66-.97.94-1.91.96-1.96-.02-.01-1.84-.72-1.86-2.85l.03-.13ZM14.3 5.04c.48-.6.82-1.41.73-2.23-.7.03-1.55.47-2.06 1.06-.45.52-.84 1.34-.74 2.14.78.06 1.58-.4 2.07-.97Z'/></svg>" />

    <style>
      /* ==================== 继承原有设计系统 ==================== */
      :root {
        --nav-height: 44px;
        --bg-color: #000000;
        --card-bg: rgba(28, 28, 30, 0.6);
        --border-color: rgba(255, 255, 255, 0.08);
        --text-primary: #f5f5f7;
        --text-secondary: #a1a1a6;
        --text-tertiary: #6e6e73;
        --accent: #2997ff;
        /* Apple 暗色模式蓝 */
        --success: #30d158;
        --warning: #ffd60a;
        --danger: #ff453a;
        --row-hover: rgba(255, 255, 255, 0.04);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
        background: var(--bg-color);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
        padding-top: var(--nav-height);
      }

      /* ==================== 导航栏 (保持原样) ==================== */
      .global-nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 9999;
        height: var(--nav-height);
        background: rgba(22, 22, 23, 0.8);
        backdrop-filter: saturate(180%) blur(20px);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        border-bottom: 1px solid var(--border-color);
      }

      .nav-container {
        max-width: 1024px;
        height: 100%;
        margin: 0 auto;
        padding: 0 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .nav-logo {
        color: var(--text-primary);
        text-decoration: none;
        display: flex;
        align-items: center;
      }

      .nav-logo svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }

      .nav-links {
        display: flex;
        gap: 24px;
        font-size: 12px;
        color: var(--text-secondary);
      }

      .nav-links a {
        color: inherit;
        text-decoration: none;
        transition: color 0.2s;
      }

      .nav-links a:hover {
        color: #fff;
      }

      /* ==================== 页面主体布局 ==================== */
      .page-content {
        max-width: 1024px;
        margin: 40px auto;
        padding: 0 22px;
      }

      .page-header {
        margin-bottom: 32px;
      }

      .page-title {
        font-size: 40px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
      }

      .page-subtitle {
        font-size: 17px;
        color: var(--text-secondary);
        font-weight: 400;
      }

      /* ==================== Apple 风格表格核心样式 ==================== */
      .table-wrapper {
        background: var(--card-bg);
        border-radius: 18px;
        border: 1px solid var(--border-color);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        position: relative;
        z-index: 1;
      }

      .apple-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 14px;
        text-align: left;
      }

      /* 表头：粘性定位 + 毛玻璃 */
      .apple-table thead th {
        position: sticky;
        top: 44px;
        /* 紧贴导航栏下方 */
        z-index: 20;
        background: rgba(28, 28, 30, 0.95);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        padding: 14px 20px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--text-secondary);
        border-bottom: 1px solid var(--border-color);
        white-space: nowrap;
      }

      .apple-table thead th:first-child {
        border-top-left-radius: 17px;
      }

      .apple-table thead th:last-child {
        border-top-right-radius: 17px;
      }

      .apple-table tbody tr:last-child td:first-child {
        border-bottom-left-radius: 17px;
      }

      .apple-table tbody tr:last-child td:last-child {
        border-bottom-right-radius: 17px;
      }

      /* 表格内容 */
      .apple-table tbody td {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border-color);
        color: var(--text-primary);
        vertical-align: middle;
        transition: background 0.2s ease;
        position: relative;
        z-index: 1;
      }

      .apple-table tbody tr:last-child td {
        border-bottom: none;
      }

      .apple-table tbody tr:hover td {
        background: var(--row-hover);
      }

      /* 单元格特殊样式 */
      .cell-primary {
        font-weight: 500;
        color: #fff;
      }

      .cell-secondary {
        font-size: 12px;
        color: var(--text-tertiary);
        margin-top: 2px;
      }

      .cell-mono {
        font-family: "SF Mono", "Menlo", monospace;
        font-size: 13px;
        color: var(--text-secondary);
        letter-spacing: -0.02em;
      }

      /* 状态标签 (Pill Badge) */
      .status-badge {
        display: inline-flex;
        align-items: center;
        padding: 3px 10px;
        border-radius: 100px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .status-active {
        background: rgba(48, 209, 88, 0.15);
        color: var(--success);
      }

      .status-pending {
        background: rgba(255, 214, 10, 0.15);
        color: var(--warning);
      }

      .status-inactive {
        background: rgba(255, 69, 58, 0.15);
        color: var(--danger);
      }

      /* 操作按钮 */
      .action-btn {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--accent);
        font-size: 13px;
        font-weight: 500;
        padding: 4px 8px;
        border-radius: 6px;
        transition: background 0.2s;
      }

      .action-btn:hover {
        background: rgba(41, 151, 255, 0.1);
      }

      /* 响应式处理 */
      @media (max-width: 768px) {
        .page-title {
          font-size: 28px;
        }

        .apple-table thead {
          display: none;
        }

        /* 移动端隐藏表头 */
        .apple-table tbody td {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 14px 18px;
          border-bottom: 1px solid var(--border-color);
        }

        .apple-table tbody tr:first-child td:first-child {
          border-top-left-radius: 17px;
          border-top-right-radius: 17px;
        }

        .apple-table tbody tr:last-child td:first-child {
          border-bottom-left-radius: 17px;
          border-bottom-right-radius: 17px;
        }

        .apple-table tbody td::before {
          content: attr(data-label);
          font-size: 12px;
          font-weight: 600;
          color: var(--text-tertiary);
          text-transform: uppercase;
          margin-right: 12px;
        }
      }
    </style>
  </head>
  <body>

    <!-- 导航栏 -->
    <nav class="global-nav">
      <div class="nav-container">
        <a href="index.html" class="nav-logo">
          <svg viewBox="0 0 20 24">
            <path d="M16.67 12.68c-.07-1.77 1.45-2.63 1.52-2.66-.83-1.2-2.1-1.37-2.56-1.39-1.08-.11-2.12.64-2.67.64-.55 0-1.4-.62-2.3-.6-1.18.01-2.27.68-2.88 1.74-1.23 2.12-.32 5.26.88 6.98.58.84 1.28 1.78 2.2 1.75.88-.04 1.21-.57 2.28-.57 1.06 0 1.36.57 2.28.55.94-.02 1.54-.86 2.12-1.7.66-.97.94-1.91.96-1.96-.02-.01-1.84-.72-1.86-2.85l.03-.13ZM14.3 5.04c.48-.6.82-1.41.73-2.23-.7.03-1.55.47-2.06 1.06-.45.52-.84 1.34-.74 2.14.78.06 1.58-.4 2.07-.97Z" />
          </svg>
        </a>
        <div class="nav-links">
          <a href="#">人才</a>
          <a href="#">澡堂</a>
          <a href="#">艺人</a>
          <a href="#">农田</a>
        </div>
      </div>
    </nav>

    <!-- 主内容区 -->
    <main class="page-content">
      <header class="page-header">
        <h1 class="page-title">时光杂货店</h1>
        <p class="page-subtitle">记录一下上一次榜单的历史最高收入</p>
      </header>

      <div class="table-wrapper">
        <table class="apple-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>上轮历史最高收入</th>
              <th>上轮涨幅</th>
              <th>历史最高收入</th>
              <th>🈵月卡</th>

              <th style="text-align: right;">20%</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td data-label="Order ID" class="cell-mono">Stella</td>
              <td data-label="Customer">
                <div class="cell-primary">6.45亿</div>

              <td data-label="Amount" class="cell-mono">6.979亿</td>
              <td data-label="Status"><span class="status-badge status-active">8.35亿</span></td>
              <td data-label="Status"><span class="status-badge status-active">7.677亿</span></td>
              <td data-label="Status" style="text-align: right;"><span class="status-badge status-active">8.375亿</span></td>
            </tr>
            <tr>
              <td data-label="Order ID" class="cell-mono">ni9ht</td>
              <td data-label="Customer">
                <div class="cell-primary">5.48亿</div>
                <div class="cell-secondary">🈚月卡</div>
              </td>
              <td data-label="Date" class="cell-secondary">5445万</td>
              <td data-label="Amount" class="cell-mono">6.0245亿</td>
              <td data-label="Status"><span class="status-badge status-pending">7.537亿</span></td>
              <td data-label="Status"><span class="status-badge status-pending">6.633亿</span></td>
              <td data-label="Status" style="text-align: right;"><span class="status-badge status-pending">7.236亿</span></td>
            </tr>
            <tr>
              <td data-label="Order ID" class="cell-mono">jojo</td>
              <td data-label="Customer">
                <div class="cell-primary">未知</div>
                <div class="cell-secondary">🈚</div>
              </td>
              <td data-label="Date" class="cell-secondary">1亿</td>
              <td data-label="Amount" class="cell-mono">0万</td>
              <td data-label="Status"><span class="status-badge status-inactive">1亿</span></td>
              <td data-label="Action" style="text-align: right;"><button class="action-btn">1亿</button></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
