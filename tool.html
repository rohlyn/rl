<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>常用网站</title>
    <!-- 等宽数字字体，防止毫秒跳动时宽度抖动 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: rgba(22, 22, 23, 0.8);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container { text-align: center; max-width: 600px; width: 100%; }

        h1 {
            font-size: 2.5rem; margin-bottom: 8px;
            background: white;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        .subtitle { color: #aaa; font-size: 1.1rem; margin-bottom: 32px; }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-radius: 16px; padding: 32px; margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card p { color: #ccc; line-height: 1.8; font-size: 1.05rem; }

        /* ===== 时钟专属样式 ===== */
        .clock-card { padding: 24px 32px; }

        .clock-label {
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 3px;
            color: #888; margin-bottom: 8px; font-weight: 600;
        }

        .clock-date { font-size: 0.9rem; color: #999; margin-bottom: 12px; }

        .clock-time {
            display: flex; align-items: baseline; justify-content: center; gap: 2px;
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }

        .clock-main {
            font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 700; line-height: 1;
            text-shadow: 0 0 20px rgba(118, 75, 162, 0.4);
        }

        .clock-ms {
            font-size: clamp(1rem, 3vw, 1.6rem); font-weight: 400;
            min-width: 3ch; text-align: left; opacity: 0.85;
            background: linear-gradient(45deg, #667eea, #f093fb);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        .clock-ms::before { content: '.'; margin-right: 1px; }
        /* ===== 时钟样式结束 ===== */

        .links { display: flex; flex-direction: column; gap: 12px; }

        .link-btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 14px 24px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px; color: #fff; text-decoration: none;
            font-size: 1.05rem; transition: all 0.3s ease;
        }

        .link-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .link-btn .icon { font-size: 1.3rem; }

        .footer { margin-top: 32px; color: #666; font-size: 0.85rem; }

        .tag {
            display: inline-block; background: rgba(255, 255, 255, 0.1);
            padding: 4px 12px; border-radius: 20px;
            font-size: 0.85rem; margin: 4px; color: #ccc;
        }
     
    </style>
</head>
<body>
    <div class="container">
        <h1>常用网站</h1>
        <p class="subtitle">开发者 · 写作者 · 终身学习者</p>
        <!-- 介绍卡片 -->
        <div class="card">
            <p>分享一些个人比较喜欢的网站</p>
            <div style="margin-top: 16px;">
                <span class="tag">HTML</span>
                <span class="tag">CSS</span>
                <span class="tag">JS</span>
                <span class="tag">Python</span>
            </div>
        </div>        
        <!-- 链接按钮 -->
        <div class="links">
            <a href="https://cloudflare.com" target="_blank" rel="noopener noreferrer" class="link-btn">
               <i class="fa-brands fa-cloudflare"></i>CloudFlare
            </a>
            <a href="https://itdog.cn" target="_blank" rel="noopener noreferrer" class="link-btn">
               <i class="fas fa-dog" /></i>ITDOG
            </a>
            <a href="https://dnshe.com" target="_blank" rel="noopener noreferrer" class="link-btn">
               <i class="fas fa-window-maximize"></i>DNSHE
            </a>
            <a href="https://ip111.cn" target="_blank" rel="noopener noreferrer" class="link-btn">
               <i class="fas fa-map-marker-alt"></i>IP查询
            </a>
            <a href="https://yudou.us" target="_blank" rel="noopener noreferrer" class="link-btn">
               <i class="fas fa-building"></i>玉豆分享
            </a>
            <a href="https://CHATGPD.COM" target="_blank" rel="noopener noreferrer" class="link-btn">
               <i class="fas fa-robot"></i>CHATGPT
            </a>
            <a href="https://ceshi.327n.com" target="_blank" rel="noopener noreferrer" class="link-btn">
               <i class="fas fa-video"></i>奇优影院
            </a>
            <!-- YouTube -->
            <a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer" class="link-btn">
               <i class="fa-brands fa-youtube"></i>YOUTUBE
            </a>
            <!-- Google -->
            <a href="https://www.google.com" target="_blank" rel="noopener noreferrer" class="link-btn">
                <i class="fa-brands fa-google"></i>GOOGLE
            </a>
            <!-- Telegram -->
            <a href="https://WEB.TELEGRAM.ORG" target="_blank" rel="noopener noreferrer" class="link-btn">
                <i class="fa-brands fa-telegram"></i>TELEGRAM
            </a>
            <!-- Twitter/X -->
            <a href="https://www.twitter.com" target="_blank" rel="noopener noreferrer" class="link-btn">
                <i class="fa-brands fa-twitter"></i>Twitter/X
            </a>
            <!-- Facebook -->
            <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer" class="link-btn">
                <i class="fa-brands fa-facebook"></i>Facebook
            </a>
            <!-- Instagram -->
            <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer" class="link-btn">
                <i class="fa-brands fa-instagram"></i>Instagram
            </a>
            <!-- Github -->
            <a href="https://www.github.com" target="_blank" rel="noopener noreferrer" class="link-btn">
                <i class="fa-brands fa-github"></i>Github
            </a>
             <!-- Tiktok -->
            <a href="https://www.tiktok.com" target="_blank" rel="noopener noreferrer" class="link-btn">
                <i class="fa-brands fa-tiktok"></i>Tiktok
            </a>
            <a href="https://www.toolshu.com/html" target="_blank" rel="noopener noreferrer" class="link-btn">
                <i class="⌨️"></i>在线html编辑器
            </a>
        </div>
        <p class="footer">© 2026 Lorraine · 由 Cloudflare Pages 驱动 · 全世界秒开 🚀</p>
    </div>
</body>
</html>
